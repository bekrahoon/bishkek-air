name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  offline-pipeline:
    # Runs the whole pipeline against the offline fake API, so changes to
    # extract code, dbt models or tests are validated without network access.
    runs-on: ubuntu-latest
    env:
      LAKE_DIR: ${{ github.workspace }}/data/lake
      WAREHOUSE_PATH: ${{ github.workspace }}/data/warehouse.duckdb
      BACKFILL_START: "2025-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m pipeline.run all --synthetic
