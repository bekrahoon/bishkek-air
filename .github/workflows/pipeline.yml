name: pipeline

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "dbt/**"
      - "requirements.txt"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAKE_DIR: ${{ github.workspace }}/data/lake
      WAREHOUSE_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Restore the Parquet lake from the data-lake branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data-lake > /dev/null; then
            git fetch --depth 1 origin data-lake
            git archive FETCH_HEAD lake | tar -x -C data
            echo "restored $(find data/lake -name '*.parquet' | wc -l) parquet files"
          else
            echo "no lake yet: this run backfills the full history"
          fi

      - name: Extract
        timeout-minutes: 35
        run: python -m pipeline.run extract

      - name: Transform and test (dbt build)
        run: python -m pipeline.run transform

      - name: Export marts for the dashboard
        run: python -m pipeline.run export

      - name: Save the lake (single-commit branch, no history bloat)
        # Runs even if a later step failed, so backfill progress is never lost.
        if: always() && hashFiles('data/last_extract.json') != ''
        run: |
          rm -rf /tmp/lake-repo && mkdir -p /tmp/lake-repo
          mkdir -p data/lake
          cp -r data/lake data/last_extract.json /tmp/lake-repo/
          # Vercel builds every branch from the "web" root directory; this tells it
          # to skip the data branch instead of failing on a missing folder.
          mkdir -p /tmp/lake-repo/web
          echo '{"git": {"deploymentEnabled": false}}' > /tmp/lake-repo/web/vercel.json
          cd /tmp/lake-repo
          git init -q -b data-lake
          git add -A
          git -c user.name="bishkek-air-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "lake snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data-lake

      - name: Publish dashboard data
        # The JSON files are fully regenerated each run, so we always lay them
        # on top of the latest main instead of rebasing (no merge conflicts).
        run: |
          git config user.name "bishkek-air-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/web-data && cp -r web/data /tmp/web-data
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B publish origin/main
            rm -rf web/data && cp -r /tmp/web-data web/data
            git add -A web/data
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -qm "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q origin HEAD:main && exit 0
            echo "main moved, retrying ($attempt)"; sleep 5
          done
          exit 1

      - name: Run summary
        if: always()
        run: |
          echo "## Pipeline run" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/last_extract.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat data/last_extract.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
